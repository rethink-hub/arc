name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Redirects live in _data/redirects.yml; republish the function only when it changed.
      - name: Update CloudFront function
        run: |
          ruby cloudfront/build-function.rb > /tmp/rewrite.js
          aws cloudfront get-function --name arc-rewrite --stage LIVE /tmp/live.js > /dev/null
          if cmp -s /tmp/rewrite.js /tmp/live.js; then echo "function unchanged"; exit 0; fi
          ETAG=$(aws cloudfront describe-function --name arc-rewrite --query ETag --output text)
          ETAG=$(aws cloudfront update-function --name arc-rewrite --if-match "$ETAG" \
            --function-config Comment="arcassistant.app rewrites and redirects",Runtime=cloudfront-js-2.0 \
            --function-code fileb:///tmp/rewrite.js --query ETag --output text)
          aws cloudfront publish-function --name arc-rewrite --if-match "$ETAG" --query FunctionSummary.Status --output text

      - name: Upload to S3
        working-directory: _site
        run: |
          # Assets: cached for a day. HTML, XML, JSON and robots.txt: 5 minutes, so edits show up quickly.
          aws s3 sync . "s3://${{ vars.S3_BUCKET }}" --delete --exclude "*.html" --exclude "*.xml" --exclude "*.json" --exclude "robots.txt" \
            --cache-control "public, max-age=86400" --only-show-errors
          aws s3 sync . "s3://${{ vars.S3_BUCKET }}" --exclude "*" --include "*.html" --include "*.xml" --include "*.json" --include "robots.txt" \
            --cache-control "public, max-age=300, must-revalidate" --only-show-errors

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*" --query Invalidation.Id --output text
