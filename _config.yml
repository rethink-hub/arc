# GitHub Pages Configuration for Arc

# Site settings
title: "AI Assistant App That Works on Any Screen | Arc"
description: "Arc is a free AI assistant app that works on the screen you're already on. Summarize, listen, rewrite and automate in any app. Android and Mac."
author: "Mamata"
tagline: "Understand Your Screen. Instantly."

# Theme selection
# theme: jekyll-theme-cayman  # Removed: custom _layouts override theme

# Build settings
markdown: kramdown
permalink: pretty

# Plugins — custom meta is hand-written in _layouts/default.html (jekyll-seo-tag not used);
# custom sitemap.xml (jekyll-sitemap not loaded)
plugins:
  - jekyll-feed

# jekyll-redirect-from was removed (89987a8), and the old .html URLs then 404'd.
# Search Console showed that threw away the github.io-era history (~41K
# impressions) because GitHub forwards rethink-hub.github.io/arc/X.html to
# arcassistant.app/X.html. Those URLs now get explicit moved-page stubs in
# legacy/ (layout: redirect): an instant meta refresh plus a canonical to the
# new URL, excluded from sitemap.xml. Add a stub there when a URL is retired.

# SEO settings
lang: en-US
url: "https://arcassistant.app" # Custom root domain (GitHub Pages via CNAME)
baseurl: "" # Root domain — no subdirectory

# Social and contact info (for SEO)
social:
  name: Mamata
  links:
    - https://play.google.com/store/apps/details?id=com.rethink.arc
    - https://x.com/rethink_hub

# Additional SEO metadata
keywords: "ai assistant app, ai assistant for windows, android ai assistant, ai assistant for mac, personal ai assistant, ai note taker, ai summarizer, ai workflow automation, ai shortcuts, ai reply generator, free ai assistant"

# Arc for macOS release metadata — bump `version` when cutting a Mac release and
# upload the matching dist/Arc-<version>.dmg to /downloads/. The macos.md download
# button and the Sparkle appcast must both point at the same file.
mac_app:
  version: "1.0.2"
  min_macos: "14.0"
  dmg: "/downloads/Arc-1.0.2.dmg"

# App-specific metadata
app:
  name: "Arc: AI Screen Assistant"
  package: "com.rethink.arc"
  category: "Productivity"
  platform: "Android, macOS"
  price: "Freemium with subscription"
  features:
    - "AI-powered text summarization"
    - "Text-to-speech with language detection"
    - "AI chat for any screen content"
    - "Custom AI workflow automation"
    - "Community AI actions"
    - "Privacy-focused design"

# Google Analytics 4 (add your tracking ID when ready)
# google_analytics: G-XXXXXXXXXX

# Webmaster verification codes
webmaster_verifications:
  google: "uasxVvwHB2RKEkZYh15-z6cjzqrGbJPM4DCoubNk5Y8"

# Exclude files from build — prevent junk pages in sitemap
exclude:
  - README.md
  - DEPLOYMENT.md
  - LOCAL_PREVIEW.md
  - SEO-IMPLEMENTATION-COMPLETE.md
  - DEPLOY-AND-TEST.md
  - VERIFICATION-REPORT.md
  - FINAL-STATUS.md
  - QUICK-DEPLOY.sh
  - Dockerfile
  - docker-compose.yml
  - generate-og-images.py
  - assets/images/SOCIAL-SHARE-IMAGE-GUIDE.md
  - assets/README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .DS_Store

# Include files
include:
  # Jekyll skips dot-directories by default, so .well-known must be named
  # explicitly or assetlinks.json never reaches _site and Android App Links
  # silently fall back to opening the browser.
  - .well-known
  - _pages
  - privacy.md
  - assets

# Default layout
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "_posts"
    values:
      layout: blog
  - scope:
      path: "assets"
    values:
      layout: null